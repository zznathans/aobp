name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["charts/**", "**.md"]
  pull_request:
    paths-ignore: ["charts/**", "**.md"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy app

  matrix-config:
    runs-on: ubuntu-latest
    outputs:
      # Full compatibility matrix only on push to main (i.e. after a PR
      # merges, before anything gets released) - PRs get fast feedback on
      # just the newest Python version instead of paying for all 4 legs on
      # every push.
      python-versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'versions=["3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["3.14"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [matrix-config]
    runs-on: ubuntu-latest
    # Job-level permissions replace (not merge with) the workflow-level
    # block above, so contents: read has to be repeated here too, or
    # actions/checkout loses read access and fails with "not found".
    # pull-requests: write is for the Coveralls step below (it posts a PR
    # comment with the coverage diff) - everything else in this job needs
    # no elevated permissions.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.matrix-config.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov-report=lcov:coverage.lcov

      # Informational only - not a required status check, so a coverage
      # regression never blocks merging. Only reported once (on the
      # newest Python version) since Coveralls doesn't need every
      # matrix leg's report. continue-on-error because the action's own
      # default (fail-on-error: true) means a Coveralls-side outage -
      # not our data - would otherwise fail this job.
      - name: Coveralls
        if: matrix.python-version == '3.14'
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
