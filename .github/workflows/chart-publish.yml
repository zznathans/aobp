name: Chart Publish

# Triggered by a published GitHub Release, same as docker-publish.yml, so
# the chart version and image tag are cut together. Packages the chart with
# --version/--app-version overridden from the release tag rather than
# whatever's committed in Chart.yaml - so cutting a release is the only
# step, no version-bump commit/PR needed first. Pushed as an OCI artifact
# to GHCR: `helm install oci://ghcr.io/zznathans/eve-build/charts/eve-build --version X.Y.Z`.
#
# workflow_dispatch is a fallback for re-running a publish whose
# release:published event never arrived (e.g. an Actions outage) - dispatch
# it with the release tag to (re-)publish (`gh workflow run
# chart-publish.yml -f tag=1.9.0`). The tag input drives both which commit
# gets checked out and the packaged chart version, so this works
# regardless of which branch the dispatch itself runs from - it doesn't
# need to (and, per GitHub's workflow_dispatch rules, can't reliably)
# target the release tag ref directly, since that ref predates this
# trigger existing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)publish, e.g. 1.9.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    name: Publish (OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: azure/setup-helm@v5
        with:
          version: "3.17.0"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine chart version from release tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package charts/eve-build \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            -d /tmp/chart-out
          helm push /tmp/chart-out/eve-build-*.tgz oci://ghcr.io/zznathans/eve-build/charts
