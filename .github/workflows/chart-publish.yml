name: Chart Publish

# Triggered by a published GitHub Release, same as docker-publish.yml, so
# the chart version and image tag are cut together. Packages the chart with
# --version/--app-version overridden from the release tag rather than
# whatever's committed in Chart.yaml - so cutting a release is the only
# step, no version-bump commit/PR needed first. Pushed as an OCI artifact
# to GHCR: `helm install oci://ghcr.io/zznathans/aobp/charts/aobp --version X.Y.Z`.
#
# workflow_dispatch is a fallback for re-running a publish whose
# release:published event never arrived (e.g. an Actions outage) - dispatch
# it against the release tag itself (`gh workflow run chart-publish.yml
# --ref <tag>`) so the version step's github.ref_name fallback below picks
# up the same tag a real release event would.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    name: Publish (OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "3.17.0"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine chart version from release tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package charts/aobp \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            -d /tmp/chart-out
          helm push /tmp/chart-out/aobp-*.tgz oci://ghcr.io/zznathans/aobp/charts
