name: Cut Release

# Stage 2 of 2 - see prepare-release.yaml for the full explanation. Fires
# once a "chore(release): X.Y.Z" PR (opened by prepare-release.yaml) merges,
# and creates the actual version tag + GitHub Release via the GitHub API
# (semantic-release's @semantic-release/github plugin) - not a git push, so
# the branch ruleset never applies to it. Chart.yaml/pyproject.toml are
# already correct on main by the time this runs, since that's exactly what
# the merged PR contains.
#
# Triggered by workflow_run (same as prepare-release.yaml), NOT
# pull_request: @semantic-release/github refuses to publish when the event
# is "pull_request". Partitioned from prepare-release.yaml by the merge
# commit's message so only one of them ever acts on a given commit.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  cut-release:
    name: Semantic Release (publish)
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (
        startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') ||
        contains(github.event.workflow_run.head_commit.message, '/release/')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
