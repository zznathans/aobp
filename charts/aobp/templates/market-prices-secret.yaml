{{- if not .Values.aobp.marketPrices.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-market-prices
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  apiKey: {{ required "aobp.marketPrices.refreshApiKey is required unless aobp.marketPrices.existingSecret is set - generate one with `openssl rand -hex 32`" .Values.aobp.marketPrices.refreshApiKey | quote }}
{{- end }}
