{{- if not .Values.aobp.session.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-session
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  secretKey: {{ required "aobp.session.secretKey is required unless aobp.session.existingSecret is set - generate one with `openssl rand -hex 32`" .Values.aobp.session.secretKey | quote }}
{{- end }}
