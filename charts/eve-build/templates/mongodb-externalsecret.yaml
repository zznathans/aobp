{{- if .Values.mongodb.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-mongodb-external
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.mongodb.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.mongodb.externalSecret.secretStoreRef }}
    kind: {{ .Values.mongodb.externalSecret.secretStoreKind }}
  target:
    name: {{ .Release.Name }}-mongodb-external
    template:
      data:
        uri: >-
          mongodb+srv://{{ "{{" }} .db_user {{ "}}" }}:{{ "{{" }} .db_password {{ "}}" }}@{{ "{{" }} {{ .Values.mongodb.externalSecret.usePublicHost | ternary ".db_host_public" ".db_host" }} {{ "}}" }}/{{ "{{" }} .db_name {{ "}}" }}{{ with .Values.mongodb.externalSecret.uriOptions }}?{{ . }}{{ end }}
        # Passed through so eve-build.env can source MONGODB_DATABASE from the same secret
        # the URI's own database segment comes from, instead of the separate
        # `mongodb.database` value - the app selects its database by this env var, not by
        # whatever's in the URI's path, so the two must always agree.
        dbName: >-
          {{ "{{" }} .db_name {{ "}}" }}
  dataFrom:
    - extract:
        key: {{ .Values.mongodb.externalSecret.remoteKey }}
{{- end }}
