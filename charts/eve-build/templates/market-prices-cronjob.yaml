{{- $marketPricesSecretName := .Values.eveBuild.marketPrices.existingSecret | default (printf "%s-market-prices" .Release.Name) }}
{{- $marketPricesSecretKey := (ne .Values.eveBuild.marketPrices.existingSecret "") | ternary .Values.eveBuild.marketPrices.existingSecretKey "apiKey" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-market-prices-refresh
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.eveBuild.marketPrices.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: market-prices-refresh
              image: curlimages/curl:latest
              env:
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $marketPricesSecretName }}
                      key: {{ $marketPricesSecretKey }}
              command:
                - sh
                - -c
                - >-
                  curl -sf -X POST -H "X-Api-Key: $(API_KEY)"
                  http://{{ .Release.Name }}:{{ .Values.eveBuild.service.port }}/market-prices/refresh
