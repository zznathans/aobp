{{- if not .Values.eveBuild.marketPrices.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-market-prices
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  apiKey: {{ required "eveBuild.marketPrices.refreshApiKey is required unless eveBuild.marketPrices.existingSecret is set - generate one with `openssl rand -hex 32`" .Values.eveBuild.marketPrices.refreshApiKey | quote }}
{{- end }}
