{{- if and .Values.rabbitmq.enabled .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ .Release.Name }}-rabbitmq-conn
  namespace: {{ .Release.Namespace }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ include "eve-build.rabbitmqSecretName" . }}
      key: {{ include "eve-build.rabbitmqSecretKey" . }}
{{- end }}
