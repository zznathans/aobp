{{- if not .Values.eveBuild.session.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-session
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  secretKey: {{ required "eveBuild.session.secretKey is required unless eveBuild.session.existingSecret is set - generate one with `openssl rand -hex 32`" .Values.eveBuild.session.secretKey | quote }}
{{- end }}
