suite: mongodb-externalsecret
templates:
  - mongodb-externalsecret.yaml
tests:
  - it: renders nothing when disabled (the default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret when enabled
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: external-secrets.io/v1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mongodb-external
      - equal:
          path: spec.secretStoreRef
          value:
            name: my-store
            kind: SecretStore
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-mongodb-external
      - equal:
          path: spec.dataFrom[0]
          value:
            extract:
              key: prod/mongodb

  - it: assembles the uri template from the extracted DigitalOcean-shaped fields
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
    asserts:
      - equal:
          path: spec.target.template.data.uri
          value: "mongodb+srv://{{ .db_user }}:{{ .db_password }}@{{ .db_host }}/{{ .db_name }}?authSource=admin&tls=true"

  - it: omits the query string when uriOptions is empty
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
      mongodb.externalSecret.uriOptions: ""
    asserts:
      - equal:
          path: spec.target.template.data.uri
          value: "mongodb+srv://{{ .db_user }}:{{ .db_password }}@{{ .db_host }}/{{ .db_name }}"

  - it: passes custom uriOptions through
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
      mongodb.externalSecret.uriOptions: "replicaSet=rs0"
    asserts:
      - equal:
          path: spec.target.template.data.uri
          value: "mongodb+srv://{{ .db_user }}:{{ .db_password }}@{{ .db_host }}/{{ .db_name }}?replicaSet=rs0"

  - it: uses db_host_public when usePublicHost is set
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
      mongodb.externalSecret.usePublicHost: true
    asserts:
      - equal:
          path: spec.target.template.data.uri
          value: "mongodb+srv://{{ .db_user }}:{{ .db_password }}@{{ .db_host_public }}/{{ .db_name }}?authSource=admin&tls=true"

  - it: supports a ClusterSecretStore
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-cluster-store
      mongodb.externalSecret.secretStoreKind: ClusterSecretStore
      mongodb.externalSecret.remoteKey: prod/mongodb
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  - it: defaults the refresh interval to 1h
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: passes a custom refresh interval through
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
      mongodb.externalSecret.refreshInterval: 30m
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 30m

  - it: passes the extracted db_name through as its own key, alongside the assembled uri
    set:
      mongodb.externalSecret.enabled: true
      mongodb.externalSecret.secretStoreRef: my-store
      mongodb.externalSecret.remoteKey: prod/mongodb
    asserts:
      - equal:
          path: spec.target.template.data.dbName
          value: "{{ .db_name }}"
