suite: market-prices-secret
templates:
  - market-prices-secret.yaml
tests:
  - it: fails when refreshApiKey is unset and no existingSecret is given
    asserts:
      - failedTemplate:
          errorMessage: eveBuild.marketPrices.refreshApiKey is required unless eveBuild.marketPrices.existingSecret is set - generate one with `openssl rand -hex 32`

  - it: renders a Secret with the given refreshApiKey
    set:
      eveBuild.marketPrices.refreshApiKey: my-api-key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-market-prices
      - equal:
          path: stringData.apiKey
          value: my-api-key

  - it: renders nothing when existingSecret is set, even without refreshApiKey
    set:
      eveBuild.marketPrices.existingSecret: my-market-prices-secret
    asserts:
      - hasDocuments:
          count: 0
