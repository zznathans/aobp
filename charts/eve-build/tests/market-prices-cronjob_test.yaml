suite: market-prices-cronjob
templates:
  - market-prices-cronjob.yaml
set:
  eveBuild.marketPrices.refreshApiKey: my-api-key
tests:
  - it: renders a CronJob
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  - it: uses the configured schedule
    set:
      eveBuild.marketPrices.schedule: "*/30 * * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "*/30 * * * *"

  - it: sources the API key from the chart-managed secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-market-prices
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: apiKey

  - it: sources the API key from an existingSecret when set
    set:
      eveBuild.marketPrices.existingSecret: my-market-prices-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-market-prices-secret

  - it: never restarts the pod on failure
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
