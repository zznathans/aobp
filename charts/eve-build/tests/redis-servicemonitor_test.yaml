suite: redis-servicemonitor
templates:
  - redis-servicemonitor.yaml
tests:
  - it: renders nothing when redis is disabled (the default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when redis is enabled but the exporter is disabled
    set:
      redis.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the exporter is enabled but its serviceMonitor is disabled
    set:
      redis.enabled: true
      redis.exporter.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor when all three are enabled
    set:
      redis.enabled: true
      redis.exporter.enabled: true
      redis.exporter.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME-redis
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics

  - it: uses the configured scrape interval
    set:
      redis.enabled: true
      redis.exporter.enabled: true
      redis.exporter.serviceMonitor.enabled: true
      redis.exporter.serviceMonitor.interval: 15s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 15s

  - it: applies extra labels
    set:
      redis.enabled: true
      redis.exporter.enabled: true
      redis.exporter.serviceMonitor.enabled: true
      redis.exporter.serviceMonitor.labels:
        team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
