suite: session-secret
templates:
  - session-secret.yaml
tests:
  - it: fails when secretKey is unset and no existingSecret is given
    asserts:
      - failedTemplate:
          errorMessage: eveBuild.session.secretKey is required unless eveBuild.session.existingSecret is set - generate one with `openssl rand -hex 32`

  - it: renders a Secret with the given secretKey
    set:
      eveBuild.session.secretKey: my-signing-key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-session
      - equal:
          path: stringData.secretKey
          value: my-signing-key

  - it: renders nothing when existingSecret is set, even without secretKey
    set:
      eveBuild.session.existingSecret: my-session-secret
    asserts:
      - hasDocuments:
          count: 0
