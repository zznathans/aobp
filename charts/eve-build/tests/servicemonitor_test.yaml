suite: servicemonitor
templates:
  - servicemonitor.yaml
tests:
  - it: renders nothing when disabled (the default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor when enabled
    set:
      eveBuild.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME
      - equal:
          path: spec.endpoints[0].port
          value: http
      - equal:
          path: spec.endpoints[0].path
          value: /metrics

  - it: uses the configured scrape interval
    set:
      eveBuild.metrics.serviceMonitor.enabled: true
      eveBuild.metrics.serviceMonitor.interval: 15s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 15s

  - it: applies extra labels
    set:
      eveBuild.metrics.serviceMonitor.enabled: true
      eveBuild.metrics.serviceMonitor.labels:
        team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
